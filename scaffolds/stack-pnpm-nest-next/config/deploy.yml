# Kamal - chuẩn triển khai của harness.
#
# Vì sao Kamal chứ không phải thứ khác: elearning-platform đã chạy live staging
# bằng nó, tức chuẩn này đã qua thử lửa thật chứ không phải chọn trên giấy. Bản
# mẫu dưới đây cắt từ config/deploy.yml của elearning, thay giá trị riêng bằng
# __PROJECT_SLUG__ và các chỗ TODO.
#
# Bước 2.4 điền TODO. Bước 2.13 dùng `kamal deploy -d <destination>` và
# ship-and-verify.sh kiểm at-source rằng container đang chạy đúng commit.
#
# Workflow CI cho deploy KHÔNG nằm ở đây - nó phụ thuộc destination, registry và
# quy ước tag của từng dự án. Mẫu đầy đủ (611 dòng, có beta tag + release +
# destination chooser): elearning-platform/.github/workflows/deploy.yml. Chép và
# sửa ở 2.4, đừng dựng lại từ đầu.

service: __PROJECT_SLUG__-api
image: TODO-org/__PROJECT_SLUG__-api

ssh:
  user: deploy
  port: 22 # TODO đổi nếu SSH không ở cổng mặc định

deploy_timeout: 900

proxy:
  ssl: true
  app_port: 4000
  healthcheck:
    path: /health/ready # scaffold đã có endpoint này ở apps/api
    interval: 3

registry:
  server: ghcr.io
  username: TODO-org
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  dockerfile: apps/api/Dockerfile
  cache:
    type: registry
    image: TODO-org/__PROJECT_SLUG__-api-cache
    options: mode=max

volumes:
  - "__PROJECT_SLUG__-storage:/data/storage"

env:
  clear:
    NODE_ENV: production
    PORT: "4000"
    # Nhúng commit đang chạy vào container. ship-and-verify.sh ở 2.13 đọc lại
    # giá trị này để kiểm at-source - không có nó thì không phân biệt được
    # "deploy xong" với "deploy đúng bản".
    COMMIT_SHA: <%= %x(git rev-parse HEAD).strip %>
    REDIS_URL: redis://__PROJECT_SLUG__-redis:6379
    STORAGE_DRIVER: local
    STORAGE_LOCAL_DIR: /data/storage
  secret:
    - DATABASE_URL
    - JWT_ACCESS_SECRET
    - JWT_REFRESH_SECRET
    # TODO thêm secret riêng của dự án. Mọi khoá ở đây phải có mặt trong
    # .kamal/secrets-common, nếu không Kamal báo "Secret not found".

accessories:
  postgres:
    service: __PROJECT_SLUG__-postgres
    # Ghim theo digest, không chỉ theo tag: tag di chuyển được, digest thì không.
    # Dùng cùng image với docker-compose.yml của scaffold (pgvector).
    image: pgvector/pgvector:pg16 # TODO ghim @sha256:... trước khi lên production
    env:
      clear:
        POSTGRES_USER: __PROJECT_SLUG__
        POSTGRES_DB: __PROJECT_SLUG__
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - __PROJECT_SLUG__-pg-data:/var/lib/postgresql/data

  redis:
    service: __PROJECT_SLUG__-redis
    image: redis:7-alpine # TODO ghim @sha256:... trước khi lên production
    volumes:
      - __PROJECT_SLUG__-redis-data:/data
