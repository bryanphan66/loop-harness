packages:
  - apps/*
  - packages/*

# Dependency lifecycle scripts allowed to run (pnpm >=10 blocks them by default).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
