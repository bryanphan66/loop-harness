services:
  db:
    # pgvector/pgvector:pg16 = postgres:16 superset (adds the pgvector
    # extension); matches the hasi-hub benchmark image. Any postgres-16-
    # compatible image works — swap if this one pulls slowly on your network.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  # Full-stack dev containers are opt-in: `docker compose --profile app up`
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      API_PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      # STORAGE_* only takes effect if the project also runs --profile tier2
      # (minio) AND sets STORAGE_DRIVER=s3 — the base app profile never
      # requires tier2, this just wires the values through when both are on.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/storage-local
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-app-media}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Next.js inlines NEXT_PUBLIC_* into the browser bundle at BUILD time
      # (next build), not at container-start time — a runtime `environment:`
      # entry here would be too late and ship an empty API URL. Must be a
      # build arg, consumed by apps/web/Dockerfile's `ARG NEXT_PUBLIC_API_URL`
      # before its `next build` step.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '3000:3000'
    depends_on:
      - api

  # Tier-2, opt-in: `docker compose --profile tier2 up -d` — only needed by a
  # project with an async-job/media-pipeline/storage/external-integration
  # phase. Base `docker compose up` (no profile) never starts these, so a
  # simple db+api+web project is completely unaffected.
  redis:
    profiles: ['tier2']
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev/CI — the `s3` storage driver
  # (packages/storage-core/s3-storage-driver.ts) points STORAGE_S3_ENDPOINT at
  # this container so the signed-URL/entitlement AC path (object-storage +
  # media-pipeline playbooks) is exercised for real, without a cloud account.
  # Prod/staging swap the endpoint to Cloudflare R2 or AWS S3 — same driver.
  minio:
    profiles: ['tier2']
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the s3 driver targets, then exits. Manual
  # equivalent if you'd rather not run this container: open
  # http://localhost:9001 (console, same MINIO_ROOT_USER/PASSWORD) and create
  # the bucket named by STORAGE_S3_BUCKET (default `app-media`) by hand.
  minio-mc:
    profiles: ['tier2']
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        mc alias set local http://minio:9000
        ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin} ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123} &&
        mc mb --ignore-existing local/${STORAGE_S3_BUCKET:-app-media}
    depends_on:
      minio:
        condition: service_healthy

  worker:
    profiles: ['tier2']
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/storage-local
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-app-media}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin123}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - worker-storage-local:/data/storage-local
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db-data:
  worker-storage-local:
  minio-data:
